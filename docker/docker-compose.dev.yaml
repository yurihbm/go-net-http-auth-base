services:
  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-auth-base}-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: ${PROJECT_NAME:-auth-base}-pgadmin-dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    container_name: ${PROJECT_NAME:-auth-base}-lgtm-dev
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm_data:/data
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/go-net-http-auth-base.yaml:ro
      - ./grafana/provisioning/empty.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/custom-dashboards:ro

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-auth-base}_pg_data_dev
  pgadmin_data:
    name: ${PROJECT_NAME:-auth-base}_pgadmin_data_dev
  lgtm_data:
    name: ${PROJECT_NAME:-auth-base}_lgtm_data_dev
