services:
  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-auth-base}-db-dev
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PROJECT_NAME:-auth-base}-pgadmin-dev
    restart: always
    env_file:
      - ../.env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  lgtm:
    image: grafana/otel-lgtm:0.38.1
    container_name: ${PROJECT_NAME:-auth-base}-lgtm-dev
    restart: always
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/go-net-http-auth-base.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/custom-dashboards:ro

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-auth-base}_pg_data_dev
  pgadmin_data:
    name: ${PROJECT_NAME:-auth-base}_pgadmin_data_dev
  lgtm_data:
    name: ${PROJECT_NAME:-auth-base}_lgtm_data_dev
