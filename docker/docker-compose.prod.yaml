services:
  traefik:
    image: traefik:v3.7.19
    container_name: ${PROJECT_NAME:-auth-base}-traefik-prod
    restart: always
    command:
      - --api=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik_acme:/letsencrypt
    environment:
      API_DOMAIN: ${API_DOMAIN}
      API_PORT: ${API_PORT:-8080}
    networks:
      - edge

  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-auth-base}-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Remove this service when running migrations on CI/CD
  migrate:
    image: migrate/migrate:v4.19.1
    container_name: ${PROJECT_NAME:-auth-base}-migrate-prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ../postgres/migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'migrate -database "$$DATABASE_URL" -path /migrations up'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        API_PORT: ${API_PORT}
    container_name: ${PROJECT_NAME:-auth-base}-api-prod
    env_file:
      - ../.env
    expose:
      - "${API_PORT:-8080}"
    networks:
      - edge
      - internal
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

networks:
  edge:
    name: ${PROJECT_NAME:-auth-base}_edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal:
    name: ${PROJECT_NAME:-auth-base}_internal
    driver: bridge
    internal: true

volumes:
  traefik_acme:
    name: ${PROJECT_NAME:-auth-base}_traefik_acme_prod
  postgres_data:
    name: ${PROJECT_NAME:-auth-base}_pg_data_prod
