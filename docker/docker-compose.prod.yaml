services:
  traefik:
    image: traefik:v3.7.19
    container_name: ${PROJECT_NAME:-auth-base}-traefik-prod
    restart: always
    command:
      - --api=false
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=${PROJECT_NAME:-auth-base}_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - edge

  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-auth-base}-db-prod
    restart: always
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Remove this service when running migrations on CI/CD
  migrate:
    image: migrate/migrate:v4.19.1
    container_name: ${PROJECT_NAME:-auth-base}-migrate-prod
    env_file:
      - ../.env
    volumes:
      - ../postgres/migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'migrate -database "$$DATABASE_URL" -path /migrations up'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        API_PORT: ${API_PORT}
    container_name: ${PROJECT_NAME:-auth-base}-api-prod
    env_file:
      - ../.env
    expose:
      - "${API_PORT:-8080}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=${API_PORT:-8080}
    networks:
      - edge
      - internal
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

networks:
  edge:
    name: ${PROJECT_NAME:-auth-base}_edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal:
    name: ${PROJECT_NAME:-auth-base}_internal
    driver: bridge
    internal: true

volumes:
  traefik_acme:
    name: ${PROJECT_NAME:-auth-base}_traefik_acme_prod
  postgres_data:
    name: ${PROJECT_NAME:-auth-base}_pg_data_prod
