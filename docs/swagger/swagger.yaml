      meta:
        $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseMeta'
    type: object
  go-net-http-auth-base_internal_api.ResponseBody-array_go-net-http-auth-base_internal_domain_AuditLog:
    properties:
      data:
        items:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.AuditLog'
        type: array
      details:
        additionalProperties:
          type: string
        type: object
      error:
        type: string
