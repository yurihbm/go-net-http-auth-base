      email:
        type: string
      email_verified:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/go-net-http-auth-base_internal_domain.UserRole'
      updated_at:
        type: integer
      uuid:
        type: string
    type: object
  go-net-http-auth-base_internal_domain.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  go-net-http-auth-base_internal_domain.UserUpdateDTO:
    properties:
      name:
        type: string
    type: object
  go-net-http-auth-base_internal_domain.VerifyEmailDTO:
    properties:
