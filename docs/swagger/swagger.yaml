info:
  contact: {}
  description: |-
    REST API for user authentication and user management.
    Authenticated endpoints need the `access_token` cookie set by `POST /auth/login`. Swagger 2.0 cannot describe cookie auth, so endpoints are not marked as secured here; "Try it out" works because the browser sends the cookie.
  title: Go net/http Auth Base API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Lists audit logs with cursor pagination. Requires the `access_token`
        cookie set by POST /auth/login and the admin role.
      parameters:
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by actor UUID
        in: query
        name: actor_uuid
        type: string
      - description: Cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Start date (RFC3339)
        format: date-time
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        format: date-time
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Audit log page
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-array_go-net-http-auth-base_internal_domain_AuditLog'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: List audit logs
      tags:
      - audit-logs
  /auth/{provider}/callback:
    get:
      description: Handles the provider callback and requires the OAuth flow cookies
        set by the login step. On success sets the `access_token` and `refresh_token`
        cookies and redirects to the redirect_uri. If the provider returned an error,
        redirects to the redirect_uri with `?error=<code>`.
      parameters:
      - description: OAuth provider
        enum:
        - google
        - microsoft
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: State token issued by the login step
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code (required unless error is set)
        in: query
        name: code
        type: string
      - description: Error code returned by the provider
        in: query
        name: error
        type: string
      - description: Error description returned by the provider
        in: query
        name: error_description
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the redirect_uri
          headers:
            Location:
              description: redirect_uri, with ?error=<code> on provider error
              type: string
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Finish an OAuth login
      tags:
      - auth
  /auth/{provider}/login:
    get:
      description: Redirects to the OAuth provider and sets the OAuth flow cookies
        (nonce and PKCE verifier). The redirect_uri must be in the allow list.
      parameters:
      - description: OAuth provider
        enum:
        - google
        - microsoft
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: Allowed URI to return to after the login
        in: query
        name: redirect_uri
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the OAuth provider
          headers:
            Location:
              description: Provider authorization URL
              type: string
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Start an OAuth login
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with email and password. Sets the `access_token`
        and `refresh_token` cookies.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.CredentialsLoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Log in with credentials
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes the current session and clears the auth cookies. Requires
        the `access_token` cookie set by POST /auth/login.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Log out
      tags:
      - auth
  /auth/logout-others:
    post:
      description: Deletes every session of the user except the current one. Requires
        the `access_token` cookie set by POST /auth/login.
      responses:
        "204":
          description: Other sessions deleted
        "401":
          description: Unauthorized, or the current session was revoked or expired
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Log out of the other devices
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the refresh token. Requires the `refresh_token` cookie
        (path /auth/refresh) and sets new `access_token` and `refresh_token` cookies.
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Refresh the session tokens
      tags:
      - auth
  /auth/step-up:
    post:
      description: Emails a 6-digit code to the current email address of the user.
        Valid for 10 minutes, one request per 60 seconds per session. Requires the
        `access_token` cookie set by POST /auth/login.
      produces:
      - application/json
      responses:
        "202":
          description: Code sent
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "429":
          description: Cooldown (auth.stepUp.cooldown) or too many failed codes for
            the user in 24 hours (auth.stepUp.userLocked)
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Request a step-up code
      tags:
      - auth
  /auth/step-up/verify:
    post:
      consumes:
      - application/json
      description: Elevates the current session for 5 minutes. A code allows 5 attempts.
        Requires the `access_token` cookie set by POST /auth/login.
      parameters:
      - description: Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.StepUpVerifyDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Session elevated; step_up_until is a unix timestamp
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-map_string_int64'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Invalid code (auth.stepUp.invalidCode), no active challenge
            (auth.stepUp.noChallenge) or session revoked after too many failures (auth.stepUp.sessionRevoked,
            clears the auth cookies)
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "429":
          description: Too many failed codes for the user in 24 hours (auth.stepUp.userLocked)
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Verify a step-up code
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-string'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      description: Pings the database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-string'
        "503":
          description: Database not ready
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Readiness check
      tags:
      - health
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user and sends the verification email.
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.CreateUserDTO'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-go-net-http-auth-base_internal_domain_User'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Create a user
      tags:
      - users
  /users/{uuid}:
    delete:
      description: Requires the `access_token` cookie set by POST /auth/login and
        a recent step-up (POST /auth/step-up, then POST /auth/step-up/verify), also
        for admins.
      parameters:
      - description: User UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: User deleted
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "403":
          description: Forbidden, or step-up required (auth.stepUp.required)
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Delete a user
      tags:
      - users
    get:
      description: Requires the `access_token` cookie set by POST /auth/login.
      parameters:
      - description: User UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-go-net-http-auth-base_internal_domain_User'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Get a user by UUID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Partially updates a user. The email changes through POST /users/me/email.
        Requires the `access_token` cookie set by POST /auth/login.
      parameters:
      - description: User UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.UserUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: User updated
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-go-net-http-auth-base_internal_domain_User'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Update a user
      tags:
      - users
  /users/confirm-email-change:
    post:
      consumes:
      - application/json
      description: Applies the new email using the token from the confirmation link
        and marks it as verified.
      parameters:
      - description: Confirmation token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.ConfirmEmailChangeDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Email changed
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-go-net-http-auth-base_internal_domain_User'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Confirm an email change
      tags:
      - users
  /users/me:
    get:
      description: Requires the `access_token` cookie set by POST /auth/login.
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated user
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-go-net-http-auth-base_internal_domain_User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
      summary: Get the authenticated user
      tags:
      - users
  /users/me/email:
    post:
      consumes:
      - application/json
      description: Sends a confirmation link to the new address; the email only changes
        after POST /users/confirm-email-change. Requires the `access_token` cookie
        set by POST /auth/login and a recent step-up (POST /auth/step-up, then POST
        /auth/step-up/verify).
      parameters:
      - description: New email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-net-http-auth-base_internal_domain.RequestEmailChangeDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Confirmation sent
          schema:
            $ref: '#/definitions/go-net-http-auth-base_internal_api.ResponseBody-any'
